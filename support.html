<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumeMax Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .logo { font-size: 48px; margin-bottom: 20px; }
        h1 {
            color: #1a1a1a;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .contact-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .contact-box h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .email-link {
            display: inline-block;
            background: linear-gradient(135deg, #8B9A7C 0%, #A3B18A 100%);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 154, 124, 0.4);
        }
        .info {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✨</div>
        <h1>LumeMax Support</h1>
        <p class="subtitle">We're here to help</p>
        
        <div class="contact-box">
            <h2>Contact Us</h2>
            <a href="mailto:support@emberlabs.app" class="email-link">
                support@emberlabs.app
            </a>
        </div>
        
        <p class="info">
            Have a question, feedback, or need assistance?<br>
            Send us an email and we'll get back to you within 24-48 hours.
        </p>
        
        <p class="footer">© 2025 Ember Labs. All rights reserved.</p>
    </div>
</body>
</html>
